<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Refining | Please Hold</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #3b82f6; /* Professional blue */
            --accent-glow: rgba(59, 130, 246, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 480px;
            width: 100%;
        }

        /* Cool, professional animated icon */
        .icon-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: pulse 2s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
            opacity: 0;
        }

        .core-dot {
            width: 24px;
            height: 24px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--accent-color);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Subtle, non-intrusive action button */
        .btn {
            display: inline-block;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.75rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--text-muted);
        }

        .error-code {
            position: absolute;
            bottom: 2rem;
            left: 0;
            right: 0;
            font-family: monospace;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.1em;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-container">
            <div class="pulse-ring"></div>
            <div class="core-dot"></div>
        </div>
        
        <h1>Optimizing Experience</h1>
        <p>We are currently refining our connection pathways to ensure peak performance. Access will be restored momentarily.</p>
        
        <button class="btn" onclick="window.location.reload();">Check Connection</button>
    </div>

    <div class="error-code">STATUS_CODE: 200_REFINE</div>

</body>
</html>
